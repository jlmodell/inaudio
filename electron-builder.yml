appId: app.inaudio.desktop
productName: Inaudio
copyright: Copyright © MUCHACHO
directories:
  output: out/builder
  buildResources: assets/icons
publish:
  provider: github
  owner: shikki841
  repo: inaudio
  releaseType: release
artifactName: Inaudio-${version}-${arch}.${ext}
win:
  executableName: inaudio
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
# An assisted installer with Inaudio's own pages (assets/installer/installer.nsh), still per user
# and without administrator rights. Updates skip every page: the app installs them silently.
nsis:
  oneClick: false
  perMachine: false
  include: assets/installer/installer.nsh
  installerHeader: out/installer-art/header.bmp
mac:
  category: public.app-category.utilities
  target:
    - target: zip
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
  icon: assets/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
linux:
  category: Utility
  maintainer: MUCHACHO <maintainer@inaudio.app>
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  icon: assets/icons/icon.png
  synopsis: Offline desktop read-aloud
  description: Local, offline desktop read-aloud with on-device text-to-speech.
