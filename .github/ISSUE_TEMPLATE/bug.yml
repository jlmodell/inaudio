name: Bug report
description: Report a reproducible problem in Inaudio
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a duplicate. Do not include recordings, transcripts, credentials, or security details.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected.
      placeholder: I expected..., but...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Inaudio version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and language
      placeholder: Kokoro English
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Choose...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove paths, tokens, and other private data before sharing.
      render: text
